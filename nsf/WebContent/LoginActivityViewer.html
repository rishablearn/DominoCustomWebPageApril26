<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Activity — HCL Verse</title>
<style>
/* Login Activity Viewer v--help — self-contained, no external requests. */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #f4f4f4; --card: #ffffff; --text: #161616; --muted: #525252; --line: #e0e0e0;
    --brand: #0f62fe; --brand-dark: #0043ce; --brand-ink: #ffffff;
    --ok-bg: #defbe6; --ok-fg: #0e6027;
    --warn-bg: #fdf6dd; --warn-fg: #6e4f00;
    --bad-bg: #fff1f1; --bad-fg: #a2191f;
    --info-bg: #edf5ff; --info-fg: #0043ce;
    --radius: 6px;
}
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #161616; --card: #262626; --text: #f4f4f4; --muted: #c6c6c6; --line: #393939;
        --brand: #4589ff; --brand-dark: #78a9ff; --brand-ink: #161616;
        --ok-bg: #0e3a1c; --ok-fg: #a7f0ba;
        --warn-bg: #3d3000; --warn-fg: #f1c21b;
        --bad-bg: #4d1a1c; --bad-fg: #ffb3b8;
        --info-bg: #001d6c; --info-fg: #a6c8ff;
    }
}
html, body { height: 100%; }
body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "IBM Plex Sans", Roboto, sans-serif;
       background: var(--bg); color: var(--text); }
.hdr { background: var(--brand); color: var(--brand-ink); padding: 14px 24px; display: flex;
       align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hdr h1 { font-size: 1.15rem; font-weight: 600; }
.hdr .sub { font-size: .8rem; opacity: .9; }
.btn { font: inherit; border: 1px solid currentColor; background: transparent; color: inherit;
       padding: 6px 12px; border-radius: var(--radius); cursor: pointer; }
.btn:hover { background: rgba(127,127,127,.18); }
.btn:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
.btn[disabled] { opacity: .5; cursor: default; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card .lbl { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
.card .val { font-size: 1.15rem; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.alert { padding: 10px 14px; border-radius: var(--radius); margin-bottom: 14px; }
.alert.info { background: var(--info-bg); color: var(--info-fg); }
.alert.warn { background: var(--warn-bg); color: var(--warn-fg); }
.alert.bad  { background: var(--bad-bg);  color: var(--bad-fg); }
.alert.ok   { background: var(--ok-bg);   color: var(--ok-fg); }
.tbl-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 760px; }
caption { text-align: left; padding: 12px 16px; font-weight: 600; border-bottom: 1px solid var(--line); }
th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
tr.flagged { background: var(--warn-bg); }
tr.reported { background: var(--bad-bg); }
.mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
.sub { color: var(--muted); font-size: .8rem; }
.tag { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 10px; margin: 0 4px 4px 0; white-space: nowrap; }
.tag.ok { background: var(--ok-bg); color: var(--ok-fg); }
.tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
.tag.bad { background: var(--bad-bg); color: var(--bad-fg); }
.tag.info { background: var(--info-bg); color: var(--info-fg); }
.act { font: inherit; font-size: .8rem; border: 1px solid var(--bad-fg); color: var(--bad-fg); background: transparent;
       padding: 3px 10px; border-radius: var(--radius); cursor: pointer; }
.act:hover { background: var(--bad-bg); }
.act:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.foot { color: var(--muted); font-size: .78rem; margin-top: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header class="hdr">
    <div>
        <h1>Login Activity</h1>
        <div class="sub" id="who">Your last 5 successful sign-ins</div>
    </div>
    <div>
        <button class="btn" id="refreshBtn" type="button">Refresh</button>
        <button class="btn" id="signOutBtn" type="button" title="Ends this session and signs you out">Sign out</button>
    </div>
</header>

<main>
    <div id="alerts" role="status" aria-live="polite"></div>

    <section class="cards" aria-label="Summary">
        <div class="card"><div class="lbl">Most recent sign-in</div><div class="val" id="cLast">—</div></div>
        <div class="card"><div class="lbl">Distinct IP addresses</div><div class="val" id="cIps">—</div></div>
        <div class="card"><div class="lbl">Needs your attention</div><div class="val" id="cAttn">—</div></div>
    </section>

    <div class="tbl-wrap">
        <table id="tbl">
            <caption>Last 5 successful sign-ins to your account</caption>
            <thead>
                <tr>
                    <th scope="col">Signed in</th>
                    <th scope="col">IP address</th>
                    <th scope="col">Access source</th>
                    <th scope="col">Browser / device</th>
                    <th scope="col">Duration</th>
                    <th scope="col">Notes</th>
                    <th scope="col"><span class="sr-only">Action</span></th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden></div>
    </div>

    <p class="foot" id="foot"></p>
</main>

<script>
(function () {
    'use strict';

    // Same-origin: this page is served from loginaudit.nsf next to the agents.
    var BASE = '/loginaudit.nsf/';
    var URL_HISTORY   = BASE + 'GetLoginHistory?OpenAgent';
    var URL_HEARTBEAT = BASE + 'Heartbeat?OpenAgent';
    var URL_NOTME     = BASE + 'NotMe?OpenAgent';
    var URL_LOGOUT    = '/names.nsf?Logout&RedirectTo=/';     // Domino logout URL command
    var HEARTBEAT_MS  = 60000;
    var HDRS = { 'X-Requested-With': 'LoginAudit' };           // required by Heartbeat / NotMe agents

    function $(id) { return document.getElementById(id); }
    function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = text;   // textContent only: no HTML injection
        return n;
    }

    function showAlert(kind, msg) {
        var box = $('alerts');
        box.textContent = '';
        if (!msg) return;
        box.appendChild(el('div', 'alert ' + kind, msg));
    }

    function fmtTime(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return { main: iso || '—', sub: '' };
        return {
            main: d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }),
            sub: 'UTC ' + iso.replace('T', ' ').replace('Z', '')
        };
    }

    function fmtDuration(ev) {
        if (ev.durationSec === null || ev.durationSec === undefined) return 'Not measured';
        var s = ev.durationSec, txt;
        if (s < 60) txt = '< 1 min';
        else if (s < 3600) txt = Math.round(s / 60) + ' min';
        else txt = Math.floor(s / 3600) + ' h ' + Math.round((s % 3600) / 60) + ' min';
        if (ev.sessionState === 'active') txt += ' (active)';
        return '≈ ' + txt;
    }

    function tag(kind, text) { return el('span', 'tag ' + kind, text); }

    function render(data) {
        var rows = $('rows');
        rows.textContent = '';
        var events = (data && data.events) || [];

        if (data && data.user) $('who').textContent = data.user + ' — your last ' + events.length + ' successful sign-in(s)';

        if (!events.length) {
            $('tbl').hidden = true;
            $('empty').hidden = false;
            $('empty').textContent = 'No sign-ins have been recorded for your account yet.';
            $('cLast').textContent = '—'; $('cIps').textContent = '0'; $('cAttn').textContent = '0';
            return;
        }
        $('tbl').hidden = false;
        $('empty').hidden = true;

        var ips = {}, attn = 0;
        events.forEach(function (ev) {
            ips[ev.ip] = true;
            var needs = (ev.newIp || ev.newDevice) && !ev.notMe;
            if (needs) attn++;

            var tr = el('tr', ev.notMe ? 'reported' : (needs ? 'flagged' : ''));
            var t = fmtTime(ev.loginTime);
            var c1 = el('td'); c1.appendChild(el('div', null, t.main)); c1.appendChild(el('div', 'sub mono', t.sub));
            tr.appendChild(c1);
            tr.appendChild(el('td', 'mono', ev.ip || '—'));
            var c3 = el('td'); c3.appendChild(el('div', null, ev.accessSource || '—'));
            c3.appendChild(el('div', 'sub', ev.authMethod || '')); tr.appendChild(c3);
            var c4 = el('td'); c4.appendChild(el('div', null, (ev.browser || '—') + ' on ' + (ev.os || '—')));
            c4.appendChild(el('div', 'sub', ev.deviceType || '')); tr.appendChild(c4);
            tr.appendChild(el('td', null, fmtDuration(ev)));

            var notes = el('td');
            if (ev.thisDevice) notes.appendChild(tag('info', 'This device'));
            if (ev.firstLogin) notes.appendChild(tag('info', 'First sign-in'));
            if (ev.newIp) notes.appendChild(tag('warn', 'New IP address'));
            if (ev.newDevice) notes.appendChild(tag('warn', 'New device'));
            if (ev.notMe) notes.appendChild(tag('bad', 'Reported: not me'));
            if (!ev.newIp && !ev.newDevice && !ev.firstLogin && !ev.notMe && !ev.thisDevice) notes.appendChild(tag('ok', 'Recognised'));
            tr.appendChild(notes);

            var act = el('td');
            if (!ev.notMe) {
                var b = el('button', 'act', "This wasn't me");
                b.type = 'button';
                b.setAttribute('aria-label', "Report the sign-in at " + t.main + " from " + ev.ip + " as not me");
                b.addEventListener('click', function () { reportNotMe(ev, b); });
                act.appendChild(b);
            }
            tr.appendChild(act);
            rows.appendChild(tr);
        });

        var first = fmtTime(events[0].loginTime);
        $('cLast').textContent = first.main;
        $('cIps').textContent = String(Object.keys(ips).length);
        $('cAttn').textContent = String(attn);
        if (attn > 0) {
            showAlert('warn', attn + ' sign-in(s) came from an IP address or device not seen before. ' +
                "If you don't recognise one, press “This wasn't me” and change your password.");
        }
    }

    function setFoot(data) {
        var days = data && data.retentionDays ? data.retentionDays : null;
        $('foot').textContent =
            'Only successful sign-ins made through the web login page are listed. ' +
            (days ? 'Records are kept for ' + days + ' days. ' : '') +
            'Duration is approximate and is only measured while this page is open; otherwise it shows “Not measured”.';
    }

    function load() {
        $('refreshBtn').disabled = true;
        fetch(URL_HISTORY, { credentials: 'same-origin', cache: 'no-store' })
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function (data) {
                if (!data.ok) {
                    var msg = data.reason === 'auth'
                        ? 'You are not signed in. Please sign in to HCL Verse and reopen this page.'
                        : 'The login history is temporarily unavailable. Please try again later.';
                    showAlert('bad', msg);
                    $('tbl').hidden = true; $('empty').hidden = true;
                    return;
                }
                showAlert('', '');
                render(data);
                setFoot(data);
            })
            .catch(function () {
                showAlert('bad', 'Could not reach the login history service. Check your connection and try again.');
            })
            .then(function () { $('refreshBtn').disabled = false; });
    }

    function reportNotMe(ev, btn) {
        if (!window.confirm('Report this sign-in as not you?\n\n' + ev.loginTime + '\nIP: ' + ev.ip +
                            '\n\nSecurity will be notified. You should also change your password.')) return;
        btn.disabled = true;
        fetch(URL_NOTME, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'X-Requested-With': 'LoginAudit', 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'id=' + encodeURIComponent(ev.id)
        }).then(function (r) { return r.json(); })
          .then(function (d) {
              if (d && d.ok) {
                  showAlert('ok', 'Reported. Security has been notified. Please change your password now.');
                  load();
              } else {
                  showAlert('bad', 'The report could not be saved. Please contact IT Support.');
                  btn.disabled = false;
              }
          })
          .catch(function () {
              showAlert('bad', 'The report could not be sent. Please contact IT Support.');
              btn.disabled = false;
          });
    }

    // ── Heartbeat: lets the server estimate session duration while this page is open ──
    function beat(end) {
        return fetch(URL_HEARTBEAT + (end ? '&end=1' : ''), {
            method: 'POST', credentials: 'same-origin', headers: HDRS, keepalive: !!end
        }).catch(function () { /* best effort */ });
    }

    function signOut() {
        $('signOutBtn').disabled = true;
        beat(true).then(function () { window.location.href = URL_LOGOUT; });
    }

    $('refreshBtn').addEventListener('click', load);
    $('signOutBtn').addEventListener('click', signOut);

    load();
    beat(false);
    setInterval(function () { if (!document.hidden) beat(false); }, HEARTBEAT_MS);
})();
</script>
</body>
</html>
